name: Checks
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install host compiler
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - name: Formatting
        run: cargo fmt -- --check
      - name: Library checks
        env:
          RUSTC_BOOTSTRAP: '1'
        run: |
          cargo check --lib --locked
          cargo check --lib --locked --features runtime_trace
      - name: Host regressions
        run: python3 scripts/run_host_tests.py
      - name: Packaging and preflight regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  skyline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned Skyline toolchain
        run: bash scripts/setup_skyline_ci.sh
      - name: Build and validate unpublished candidate
        run: python3 scripts/package_release.py --output-dir dist/ci
      - name: Build diagnostic plugin
        env:
          RUSTUP_TOOLCHAIN: skyline-v3
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo skyline build --release -- --locked --features runtime_trace
          python3 - <<'PY'
          from pathlib import Path
          import struct
          binary = Path("target/aarch64-skyline-switch/release/libssbu_online_deluxe.nro").read_bytes()
          assert binary[16:20] == b"NRO0"
          assert struct.unpack_from("<I", binary, 24)[0] == len(binary)
          assert b"DELUXE_EVENT " in binary
          assert Path("SSBU_VERSION").read_text().strip().encode() in binary
          PY
